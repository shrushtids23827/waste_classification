<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#145c38">
    <title>AI Waste Classification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>♻️ AI Waste Classification</h1>
        <p>Smart Waste Management Using Artificial Intelligence</p>
    </header>

    <main>
        <section class="upload-box" aria-labelledby="uploadTitle">
            <h2 id="uploadTitle">Classify Your Waste</h2>
            <p>Choose a clear image of one item to identify its waste category.</p>

            <label class="file-picker" for="imageInput">Choose an image</label>
            <input type="file" id="imageInput" accept="image/*">

            <div class="preview-container">
                <img id="preview" class="preview" alt="Selected image preview" hidden>
            </div>

            <button id="classifyBtn" type="button">Classify Waste</button>
            <div id="result" aria-live="polite" aria-atomic="true"></div>
        </section>
    </main>

    <footer>
        <p>AI Powered Smart Waste Management System</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>
